<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" role="img" aria-label="Movie poster for Midnight Sonata in Vienna">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="55%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="goldGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <rect width="400" height="600" fill="url(#bg)"/>

  <!-- Architectural Archway & Streetlight Glow -->
  <path d="M90 460 L90 210 A110 110 0 0 1 310 210 L310 460 Z" fill="#0f172a" stroke="#fbbf24" stroke-opacity="0.35" stroke-width="1.5"/>
  <path d="M120 460 L120 220 A80 80 0 0 1 280 220 L280 460 Z" fill="url(#goldGlow)"/>

  <!-- Piano Keys Minimalist Motif -->
  <g transform="translate(120, 390)">
    <rect x="0" y="0" width="20" height="65" fill="#f8fafc" opacity="0.9"/>
    <rect x="23" y="0" width="20" height="65" fill="#f8fafc" opacity="0.9"/>
    <rect x="46" y="0" width="20" height="65" fill="#f8fafc" opacity="0.9"/>
    <rect x="69" y="0" width="20" height="65" fill="#f8fafc" opacity="0.9"/>
    <rect x="92" y="0" width="20" height="65" fill="#f8fafc" opacity="0.9"/>
    <rect x="115" y="0" width="20" height="65" fill="#f8fafc" opacity="0.9"/>
    <rect x="138" y="0" width="22" height="65" fill="#f8fafc" opacity="0.9"/>
    <rect x="14" y="0" width="12" height="40" fill="#090d16"/>
    <rect x="37" y="0" width="12" height="40" fill="#090d16"/>
    <rect x="83" y="0" width="12" height="40" fill="#090d16"/>
    <rect x="106" y="0" width="12" height="40" fill="#090d16"/>
    <rect x="129" y="0" width="12" height="40" fill="#090d16"/>
  </g>

  <!-- Golden Vinyl / Moon -->
  <circle cx="200" cy="235" r="46" fill="none" stroke="#fbbf24" stroke-width="2" opacity="0.8"/>
  <circle cx="200" cy="235" r="32" fill="none" stroke="#fbbf24" stroke-width="1" stroke-dasharray="6 4" opacity="0.6"/>
  <circle cx="200" cy="235" r="10" fill="#fbbf24"/>

  <!-- Frame -->
  <rect x="18" y="18" width="364" height="564" fill="none" stroke="#94a3b8" stroke-opacity="0.2" stroke-width="1"/>

  <!-- Typography -->
  <text x="200" y="62" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="10" letter-spacing="4">WINNER • PALME D'OR SELECTION</text>
  <text x="200" y="510" text-anchor="middle" fill="#f8fafc" font-family="serif" font-size="26" letter-spacing="5" font-weight="700">MIDNIGHT SONATA</text>
  <text x="200" y="536" text-anchor="middle" fill="#fbbf24" font-family="sans-serif" font-size="12" letter-spacing="7" font-weight="600">IN VIENNA</text>
  <text x="200" y="564" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="9" letter-spacing="3">MYSTERY • DRAMA • 2024</text>
</svg>
