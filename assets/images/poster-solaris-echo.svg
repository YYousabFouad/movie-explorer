<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" role="img" aria-label="Movie poster for Echoes of the Silent Star">
  <defs>
    <linearGradient id="spaceBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#172554"/>
    </linearGradient>
    <radialGradient id="eclipse" cx="50%" cy="42%" r="36%">
      <stop offset="0%" stop-color="#030712"/>
      <stop offset="68%" stop-color="#030712"/>
      <stop offset="74%" stop-color="#fbbf24"/>
      <stop offset="85%" stop-color="#38bdf8" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#030712" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="400" height="600" fill="url(#spaceBg)"/>

  <!-- Orbital Rings -->
  <ellipse cx="200" cy="255" rx="145" ry="42" fill="none" stroke="#94a3b8" stroke-opacity="0.3" stroke-width="1" transform="rotate(-18 200 255)"/>
  <ellipse cx="200" cy="255" rx="120" ry="30" fill="none" stroke="#fbbf24" stroke-opacity="0.4" stroke-width="1.2" transform="rotate(-18 200 255)"/>

  <!-- Eclipse Sphere -->
  <circle cx="200" cy="255" r="135" fill="url(#eclipse)"/>
  <circle cx="200" cy="255" r="76" fill="#030712" stroke="#fde68a" stroke-width="1.5" stroke-opacity="0.8"/>

  <!-- Horizon Flare -->
  <circle cx="268" cy="220" r="6" fill="#fef3c7"/>

  <rect x="16" y="16" width="368" height="568" fill="none" stroke="#e2e8f0" stroke-opacity="0.15" stroke-width="1"/>

  <!-- Typography -->
  <text x="200" y="62" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="10" letter-spacing="5">DEEP SPACE OBSERVATORY FILM</text>
  <text x="200" y="512" text-anchor="middle" fill="#f8fafc" font-family="serif" font-size="25" letter-spacing="5" font-weight="700">ECHOES OF THE</text>
  <text x="200" y="540" text-anchor="middle" fill="#fbbf24" font-family="serif" font-size="22" letter-spacing="7" font-weight="600">SILENT STAR</text>
  <text x="200" y="566" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="9" letter-spacing="3">DRAMA • SCI-FI • 2023</text>
</svg>
